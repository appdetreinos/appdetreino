<svg width="220" height="40" viewBox="0 0 220 40" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Viva FIT APP">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FF8C42"/>
    </linearGradient>
  </defs>
  <!-- Badge "A" com gradiente -->
  <rect x="0" y="6" width="28" height="28" rx="8" fill="url(#g)"/>
  <text x="14" y="27" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0A0A0A" text-anchor="middle">A</text>
  <!-- Wordmark -->
  <text x="38" y="26" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="22" font-weight="800" fill="#0A0A0A">Viva<tspan fill="#FF6B35" font-weight="800"> FIT</tspan></text>
  <!-- Chip "APP" -->
  <rect x="170" y="10" width="40" height="20" rx="6" fill="#0A0A0A" stroke="#FF6B35" stroke-width="1.5"/>
  <text x="190" y="24" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FF6B35" letter-spacing="1.5" text-anchor="middle">APP</text>
</svg>
